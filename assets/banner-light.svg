<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="Benefícios para Estudantes no Brasil">
  <defs>
    <pattern id="dots-light" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#D0D7DE" />
    </pattern>
    <linearGradient id="glow-light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.10" />
      <stop offset="55%" stop-color="#3B82F6" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#F6F8FA" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="1198" height="278" rx="16" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="2" />
  <rect x="2" y="2" width="1196" height="276" rx="15" fill="url(#glow-light)" />
  <rect x="996" y="28" width="144" height="224" rx="12" fill="url(#dots-light)" opacity="0.95" />

  <g opacity="0.95">
    <rect x="64" y="34" width="120" height="5" rx="2.5" fill="#059669" />
    <rect x="192" y="34" width="68" height="5" rx="2.5" fill="#D97706" />
    <rect x="268" y="34" width="44" height="5" rx="2.5" fill="#2563EB" />
  </g>

  <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="64" y="68" fill="#059669" font-size="13" font-weight="700" letter-spacing="1.8">OPEN SOURCE · CURATED LIST · BRASIL</text>
    <text x="64" y="122" fill="#1F2328" font-size="40" font-weight="700" letter-spacing="-0.6">Benefícios para Estudantes no Brasil</text>
    <text x="64" y="158" fill="#57606A" font-size="18" font-weight="400">Planos gratuitos, descontos verificados e direitos estudantis para quem estuda no BR</text>
  </g>

  <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle">
    <rect x="64" y="198" width="178" height="38" rx="19" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5" />
    <text x="153" y="222" fill="#1F2328">GitHub Student Pack</text>

    <rect x="256" y="198" width="116" height="38" rx="19" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5" />
    <text x="314" y="222" fill="#1F2328">IA e Cloud</text>

    <rect x="386" y="198" width="204" height="38" rx="19" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5" />
    <text x="488" y="222" fill="#1F2328">Design e Produtividade</text>

    <rect x="604" y="198" width="194" height="38" rx="19" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5" />
    <text x="701" y="222" fill="#1F2328">Streaming e Hardware</text>

    <rect x="812" y="198" width="158" height="38" rx="19" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5" />
    <text x="891" y="222" fill="#1F2328">Direitos no Brasil</text>
